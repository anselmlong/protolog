syntax = "proto3";
package examples;

// Complex message for benchmarking
message BenchmarkMessage {
  // Scalar fields
  int32 int32_field = 1;
  int64 int64_field = 2;
  uint32 uint32_field = 3;
  uint64 uint64_field = 4;
  sint32 sint32_field = 5;
  sint64 sint64_field = 6;
  fixed32 fixed32_field = 7;
  fixed64 fixed64_field = 8;
  sfixed32 sfixed32_field = 9;
  sfixed64 sfixed64_field = 10;
  float float_field = 11;
  double double_field = 12;
  bool bool_field = 13;
  
  // String fields (using ArenaString optimization)
  string string_field = 14;
  string another_string = 15;
  bytes bytes_field = 16;
  
  // Nested message
  message NestedMessage {
    string nested_id = 1;
    int32 nested_value = 2;
    bytes nested_data = 3;
  }
  
  // Lazy nested message
  NestedMessage eager_nested = 17;
  NestedMessage lazy_nested = 18 [lazy = true];
  
  // Repeated fields
  repeated int32 repeated_ints = 19;
  repeated string repeated_strings = 20;
  repeated NestedMessage repeated_messages = 21;
  
  // Large payload for memory tests
  bytes large_payload = 22;
  
  // For unknown field skipping tests
  // Fields 100-200 will be considered "unknown" in older schema versions
}

// Old schema version for compatibility testing
message OldSchemaMessage {
  int32 id = 1;
  string name = 2;
  // Missing fields 3-22 that exist in BenchmarkMessage
}
